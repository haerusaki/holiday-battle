<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holiday Battle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one centred column. Sticky HUD, battle stage on top, challenge panel below.
   Single committed look: late-night 80s anime broadcast (sunset gradients, thick ink outlines, hard cel shadows). */
:root{
  color-scheme:dark;
  --ink:#150a30; --night:#22104d; --night-2:#341a78; --cream:#fff4d2; --sun:#ffc93c; --orange:#ff8a3c;
  --hot:#ff4f8b; --cyan:#4fe3ea; --good:#3ddc97; --bad:#ff6b7a; --mute:#c9bdf0;
  --glow-a:#3a1c86; --glow-b:#6b1f6e;
  --f-display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --f-body:"M PLUS Rounded 1c","Trebuchet MS","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--f-body);font-size:18px;line-height:1.45;font-weight:500;
  background-image:radial-gradient(circle at 15% 0,var(--glow-a) 0,transparent 45%),radial-gradient(circle at 90% 5%,var(--glow-b) 0,transparent 40%);background-attachment:fixed}
.app{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:10px 32px}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:4px solid var(--cyan);outline-offset:3px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.center{text-align:center;align-items:center;justify-content:center}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.02em;line-height:1.1;text-wrap:balance}
.eyebrow{font-size:.9rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sun)}
.muted{color:var(--mute)}

/* Buttons */
.btn{--sh:var(--hot);display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:58px;padding:.55em 1.2em;border:0;border-radius:16px;
  background:var(--cream);color:var(--ink);font-weight:800;font-size:1.1rem;line-height:1.2;text-align:center;box-shadow:0 6px 0 var(--sh);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--sh)}
.btn.primary{background:var(--sun);--sh:var(--orange);font-size:1.25rem}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 3px var(--cream)}
.btn.small{min-height:48px;font-size:1rem;padding:.4em .9em}
.btn.wide{width:100%}
.btn:disabled{cursor:not-allowed}
.btn.off{opacity:.5}
.toggle[aria-pressed="true"]{background:var(--good);--sh:var(--cyan)}

/* Title */
.logo{font-family:var(--f-display);font-size:clamp(2.7rem,12vw,5.4rem);line-height:.95;transform:skew(-8deg) rotate(-3deg);
  background:linear-gradient(180deg,var(--cream) 8%,var(--sun) 38%,var(--orange) 62%,var(--hot) 92%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 3px 0 var(--ink)) drop-shadow(4px 4px 0 var(--cyan));padding:.1em .15em}
.kana{font-family:var(--f-display);color:var(--cyan);letter-spacing:.35em;font-size:clamp(.9rem,3.6vw,1.3rem)}
.howto{display:grid;gap:10px;padding:0;margin:0;list-style:none}
.howto li{display:grid;grid-template-columns:2.2em 1fr;gap:10px;align-items:start;font-size:1.05rem}
.howto b.ic{display:grid;place-items:center;width:2.2em;height:2.2em;border-radius:12px;background:var(--night-2);font-size:1rem}

/* Panel = dialogue box */
.panel{background:var(--night);border:3px solid var(--cream);border-radius:20px;padding:18px;box-shadow:6px 6px 0 var(--hot)}
.prompt{font-size:clamp(1.3rem,4.8vw,1.7rem);font-weight:800;line-height:1.3;text-wrap:balance}
.gap{display:inline-block;min-width:3em;border-bottom:4px solid var(--sun);color:var(--sun);text-align:center;line-height:1}
.hintchip{display:inline-block;background:var(--night-2);border-radius:999px;padding:.1em .8em;font-weight:800;font-size:1rem}
.verbcard{font-family:var(--f-display);font-size:clamp(2.2rem,10vw,3.4rem);text-align:center;color:var(--sun);text-shadow:4px 4px 0 var(--ink);background:var(--night-2);border-radius:16px;padding:.2em .4em}
.badge{display:inline-block;border-radius:999px;padding:.15em .8em;font-weight:800;background:var(--good);color:var(--ink)}

/* Options */
.opts{display:grid;gap:14px;grid-template-columns:1fr}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opts.two .opt{padding-inline:.6em;gap:.4em;font-size:1.1rem}
@media (min-width:600px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{justify-content:flex-start;text-align:left;font-size:1.2rem;--sh:var(--cyan);min-width:0;overflow-wrap:anywhere}
.btn.primary:disabled{opacity:.5}
.opt .k{flex:none;width:1.8em;height:1.8em;border-radius:50%;background:var(--ink);color:var(--cream);display:grid;place-items:center;font-size:.8em}
.opt.is-right{background:var(--good);--sh:var(--cream)}
.opt.is-wrong{background:var(--bad);--sh:var(--cream)}
.opt.dim{opacity:.45}
.inp{width:100%;min-height:58px;font:inherit;font-size:1.3rem;font-weight:800;padding:.4em .7em;border-radius:14px;border:3px solid var(--cream);background:var(--ink);color:var(--cream)}
.inp.shake,.line.shake{animation:shake .3s}
.typeform{display:grid;grid-template-columns:1fr auto;gap:12px}
@media (max-width:480px){.typeform{grid-template-columns:1fr}}

/* Order + build */
.line{min-height:70px;border:3px dashed var(--mute);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:1.2rem;font-weight:800}
.line .end{color:var(--sun);font-size:1.5rem}
.tiles{display:flex;flex-wrap:wrap;gap:10px;min-height:56px}
.tile{min-height:52px;padding:.35em .9em;border:0;border-radius:12px;background:var(--cream);color:var(--ink);font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 var(--cyan)}
.tile[aria-pressed="true"]{background:var(--sun);box-shadow:0 4px 0 var(--orange)}
.tile:disabled{opacity:.6}
.slot{display:grid;gap:6px}
.preview{font-size:1.3rem;font-weight:800;color:var(--sun);min-height:1.5em}

/* Chat (world 4) */
.chat{background:var(--ink);border:3px solid var(--night-2);border-radius:16px;padding:12px;max-height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:.45em .8em;border-radius:16px;font-size:1.05rem}
.bub .who{display:block;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.bub.l{align-self:flex-start;background:var(--night-2);color:var(--cream);border-bottom-left-radius:4px}
.bub.r{align-self:flex-end;background:var(--cyan);color:var(--ink);border-bottom-right-radius:4px}
.bub.now{outline:3px dashed var(--sun);outline-offset:3px;font-weight:800;font-size:1.25rem}
.bub.r .gap{color:var(--ink);border-color:var(--ink)}
.bub b.fill{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:3px}

/* Feedback */
.fb{border:3px solid var(--cream);border-radius:16px;padding:16px;background:var(--ink);display:flex;flex-direction:column;gap:10px}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
.fb h3{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb .ans{font-size:1.15rem}
.fb .ans b{color:var(--sun)}
.fb .why{background:var(--night);border-radius:12px;padding:10px 12px}
.bonus{border:3px dashed var(--sun);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.bonus .say{font-size:1.3rem;font-weight:800;color:var(--sun)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);margin-inline:-16px;padding:8px 16px;margin-bottom:10px;display:grid;gap:6px 12px;align-items:center;
  grid-template-columns:auto 1fr auto auto;grid-template-areas:"world score hearts pause" "prog prog prog prog"}
@media (min-width:640px){.hud{grid-template-columns:auto 1fr auto auto auto;grid-template-areas:"world prog score hearts pause"}}
.hud-world{grid-area:world;font-family:var(--f-display);font-size:.95rem;color:var(--cyan);white-space:nowrap}
.hud-score{grid-area:score;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.hearts{grid-area:hearts;font-size:1.35rem;letter-spacing:.05em;white-space:nowrap;color:var(--hot)}
.hearts .lost{color:var(--night-2)}
.hud .pause{grid-area:pause;min-height:48px;min-width:52px;padding:0 .6em}
.prog{grid-area:prog;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.prog span{height:14px;border-radius:999px;background:var(--night-2);overflow:hidden;display:block}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--hot));transition:width .4s}

/* Stage */
.stage{position:relative;height:clamp(180px,36vw,290px);border-radius:20px;overflow:hidden;border:3px solid var(--cream);background:var(--night)}
.stage.w1{background:linear-gradient(#3a1a8a 0%,#b23a9a 42%,#ff6a5c 72%,#ffc93c 100%)}
.stage.w2{background:linear-gradient(#0d1b4d,#1c4a8a 55%,#2bb5a8)}
.stage.w3{background:linear-gradient(#1a0b45,#5a2bb0 55%,#ff7aa8)}
.stage.w4{background:linear-gradient(#070318,#1b0b4a 60%,#6a1a8a)}
.stage.w0{background:linear-gradient(#0b0618,#2a1a4a)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.fighter{position:absolute;bottom:3%}
.fighter svg{width:100%;height:100%;display:block;overflow:visible}
.hero{left:5%;height:58%;aspect-ratio:200/240}
.boss{right:5%;height:66%;aspect-ratio:1}
.boss svg{animation:float 3s ease-in-out infinite}
.bossbar{position:absolute;top:8px;right:10px;left:10px;margin-left:auto;max-width:420px;background:var(--ink);border:2px solid var(--cream);border-radius:999px;padding:3px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.8rem;font-weight:800;white-space:nowrap}
.bossbar .nm{font-family:var(--f-display);font-weight:400;font-size:.78rem;color:var(--sun)}
.hp{height:12px;border-radius:999px;background:var(--night-2);overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--orange));transition:width .5s}
.fx{position:absolute;inset:0;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 76% 58%,var(--cream) 0 1.5deg,transparent 1.5deg 8deg);
  -webkit-mask:radial-gradient(circle at 76% 58%,transparent 16%,#000 60%);mask:radial-gradient(circle at 76% 58%,transparent 16%,#000 60%)}
.fx.left{background:repeating-conic-gradient(from 0deg at 18% 62%,var(--bad) 0 1.5deg,transparent 1.5deg 8deg);-webkit-mask:radial-gradient(circle at 18% 62%,transparent 14%,#000 60%);mask:radial-gradient(circle at 18% 62%,transparent 14%,#000 60%)}
.fx.go{animation:flash .5s}
.pop{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-6deg) scale(0);font-family:var(--f-display);font-size:clamp(1.6rem,7vw,2.8rem);color:var(--sun);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),5px 5px 0 var(--hot);pointer-events:none;white-space:nowrap}
.pop.go{animation:pop .8s}
.hero.attack{animation:dash .45s}
.boss.attack{animation:lunge .45s}
.boss.hit svg{animation:hit .5s}
.hero.hurt svg{animation:hurt .5s}
.boss.dead svg{animation:die 1s forwards}
.teaser{position:absolute;right:3%;bottom:3%;height:56%;display:flex;gap:1%;align-items:flex-end}
.teaser svg{height:100%;aspect-ratio:1;filter:brightness(0) drop-shadow(0 0 5px var(--hot))}
.teaser svg:nth-child(even){height:78%}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes dash{40%{transform:translateX(70%) rotate(8deg)}}
@keyframes lunge{40%{transform:translateX(-55%) scale(1.08)}}
@keyframes hit{20%{filter:brightness(3) saturate(0);transform:translateX(10px)}40%{transform:translateX(-8px)}60%{filter:brightness(2);transform:translateX(6px)}}
@keyframes hurt{20%{filter:sepia(1) saturate(8) hue-rotate(-50deg);transform:translateX(-8px)}50%{transform:translateX(6px)}}
@keyframes die{to{transform:translateY(30%) rotate(20deg) scale(.2);opacity:0;filter:brightness(3)}}
@keyframes flash{30%{opacity:.85}100%{opacity:0}}
@keyframes pop{20%{transform:translate(-50%,-50%) rotate(-6deg) scale(1.15)}70%{transform:translate(-50%,-50%) rotate(-6deg) scale(1)}100%{transform:translate(-50%,-60%) rotate(-6deg) scale(1);opacity:0}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Voice picker */
.voice{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;margin-top:14px}
.sel{min-height:48px;max-width:100%;font:inherit;font-weight:800;padding:.3em .7em;border-radius:12px;border:3px solid var(--cream);background:var(--ink);color:var(--cream)}
.small{font-size:.9rem}

/* Fighter select */
.fighter-grid{display:grid;gap:16px}
.stage.pick{height:clamp(210px,50vw,300px)}
@media (min-width:760px){.fighter-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start}.stage.pick{height:440px;position:sticky;top:12px}}
.hero.big{left:50%;margin-left:0;transform:translateX(-50%);height:82%}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--mute);padding:0;display:grid;place-items:center}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--sun);transform:scale(1.1)}
.swatch[aria-pressed="true"]::after{content:"✔";font-weight:800;color:var(--cream);text-shadow:0 0 3px var(--ink),0 0 3px var(--ink),0 0 3px var(--ink)}
.kind{flex-direction:column;gap:2px;padding:8px;--sh:var(--cyan)}
.kind svg{width:84px;height:100px}
.kind[aria-pressed="true"]{background:var(--sun);--sh:var(--orange)}
.nametag{position:absolute;left:5%;bottom:calc(61% + 4px);max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--ink);color:var(--cream);border:2px solid var(--cream);border-radius:999px;padding:0 9px;font-size:.75rem;font-weight:800}
.pick .nametag{left:50%;transform:translateX(-50%);bottom:auto;top:10px;font-size:1rem;max-width:80%}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(21,10,48,.94);display:grid;place-items:center;padding:16px;overflow:auto}
.overlay .panel{width:min(100%,460px)}

/* Summary */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--night-2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:1.7rem;color:var(--sun);font-variant-numeric:tabular-nums}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.bar .hp{grid-column:1/-1}
.bar .hp i{background:linear-gradient(90deg,var(--cyan),var(--good))}
.mist{display:grid;gap:12px;padding:0;margin:0;list-style:none}
.mist li{background:var(--ink);border-left:6px solid var(--bad);border-radius:10px;padding:12px;display:grid;gap:4px}
.mist .q{font-weight:800}
.mist .y{color:var(--bad)} .mist .c{color:var(--good)}
.cols{display:grid;gap:16px}
@media (min-width:700px){.cols{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" class="app"></div>

<script>
(() => {
'use strict';
/* ---------- ART: original characters drawn as inline SVG ---------- */
const INK = '#150a30';
const G = 'stroke="' + INK + '" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
const svg = (vb, body) => '<svg viewBox="' + vb + '" aria-hidden="true" focusable="false">' + body + '</svg>';
const eye = (x, y, flip) => '<ellipse cx="' + x + '" cy="' + y + '" rx="9" ry="12" fill="' + INK + '"/><ellipse cx="' + x + '" cy="' + (y + 2) + '" rx="6" ry="8" fill="#4fe3ea"/><circle cx="' + (x + (flip ? -3 : 3)) + '" cy="' + (y - 5) + '" r="3.5" fill="#fff"/><circle cx="' + (x + (flip ? 3 : -3)) + '" cy="' + (y + 6) + '" r="1.8" fill="#fff"/>';

const ART = {
  // The player's fighter. c = { kind, hair, skin, outfit, accent, weapon }
  hero: c => {
    c = c || S.hero;
    const girl = c.kind === 'girl', H = c.hair, K = c.skin, O = c.outfit, A = c.accent;
    const weapon = c.weapon === 'ruler'
      ? '<rect x="142" y="24" width="16" height="118" fill="#fff4d2"/><path d="M150 38 h8 M150 54 h8 M150 70 h8 M150 86 h8 M150 102 h8 M150 118 h8" stroke-width="3"/><rect x="142" y="140" width="16" height="12" fill="' + A + '"/>'
      : c.weapon === 'brush'
        ? '<rect x="144" y="62" width="12" height="90" fill="#ff8a3c"/><rect x="141" y="46" width="18" height="18" fill="#c9bdf0"/><path d="M141 46 Q138 26 150 6 Q162 26 159 46Z" fill="' + A + '"/>'
        : '<rect x="142" y="40" width="16" height="100" fill="#ffc93c"/><path d="M142 40 L150 16 L158 40Z" fill="#fff4d2"/><rect x="142" y="140" width="16" height="12" fill="' + A + '"/>';
    return svg('0 0 200 240',
      '<g ' + G + '>' +
      (girl
        ? '<path d="M100 18 Q152 12 164 62 Q178 106 170 158 L152 140 L148 166 L130 130 L100 124 L70 130 L52 166 L48 140 L30 158 Q22 106 36 62 Q48 12 100 18Z" fill="' + H + '"/>'
        : '<path d="M52 70 L10 54 L26 74 L6 86 L52 86Z" fill="' + A + '"/>' +
          '<path d="M100 22 L116 8 L122 28 L146 16 L144 40 L170 40 L156 60 L178 78 L158 88 L166 112 L142 106 L100 118 L58 106 L34 112 L42 88 L22 78 L44 60 L30 40 L56 40 L54 16 L78 28 L84 8Z" fill="' + H + '"/>') +
      '<g transform="rotate(24 150 150)">' + weapon + '</g>' +
      '<rect x="80" y="186" width="16" height="30" fill="' + K + '"/><rect x="104" y="186" width="16" height="30" fill="' + K + '"/>' +
      '<path d="M72 212 H98 V230 H68 Q66 218 72 212Z" fill="' + A + '"/><path d="M102 212 H128 Q134 218 132 230 H102Z" fill="' + A + '"/>' +
      (girl
        ? '<path d="M70 174 H130 L142 204 H58Z" fill="#27318f"/><path d="M84 178 L78 204 M100 178 V204 M116 178 L122 204" stroke-width="3"/>'
        : '<path d="M70 176 H130 L126 198 H102 L100 190 L98 198 H74Z" fill="#27318f"/>') +
      '<path d="M72 134 Q100 122 128 134 L134 180 H66Z" fill="' + O + '"/><path d="M90 130 L100 150 L110 130" fill="#fff4d2"/>' +
      '<path d="M74 138 Q50 156 62 180 L76 174 Q70 160 82 150Z" fill="' + O + '"/>' +
      '<path d="M126 138 Q150 136 156 150 L146 160 Q138 150 122 154Z" fill="' + O + '"/><circle cx="153" cy="152" r="9" fill="' + K + '"/>' +
      '<ellipse cx="100" cy="86" rx="44" ry="40" fill="' + K + '"/>' +
      (girl
        ? '<path d="M56 88 Q50 44 100 40 Q150 44 144 88 L136 68 L126 86 L114 64 L100 82 L86 64 L74 86 L64 68Z" fill="' + H + '"/>' +
          '<path d="M56 80 Q44 106 58 130 L67 100Z" fill="' + H + '"/><path d="M144 80 Q156 106 142 130 L133 100Z" fill="' + H + '"/>' +
          '<path d="M100 36 L70 18 L76 54Z" fill="' + A + '"/><path d="M100 36 L130 18 L124 54Z" fill="' + A + '"/><circle cx="100" cy="36" r="8" fill="' + A + '"/>'
        : '<path d="M56 86 Q52 46 100 42 Q148 46 144 86 L132 64 L124 88 L112 62 L100 86 L88 62 L76 88 L68 64Z" fill="' + H + '"/>' +
          '<path d="M56 60 Q100 44 144 60 L144 72 Q100 56 56 72Z" fill="' + A + '"/>') +
      '</g>' +
      (girl
        ? '<path d="M40 82 q-3 22 4 40 M160 82 q3 22 -4 40" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>'

function sfx(notes) {

      o.connect(g); g.connect(AC.destination); o.start(at); o.stop(at + d); at += d * 0.85;
    }
  } catch (e) { /* no audio */ }
}

function renderQuestion() {

  if (q.type === 'order' && !S.work) {
    let pool = shuffle(q.tiles.map((_, i) => i));
    for (let k = 0; k < 6 && pool.every((v, i) => v === i); k++) pool = shuffle(pool);
    S.work = { pool, line: [] };
  }
  let h = '';
  if (q.chat) {
    if (!q.retry && !q._pre) { q.chat.pre.forEach(l => S.chat.push(bubble(l.who, esc(l.text)))); q._pre = true; }

  h += '<p class="eyebrow">' + instrOf(q) + '</p>';

  } else if (q.type === 'verb2') {

      h += '<div class="opts two" id="opts">' + [['reg', 'regular', 'regHint'], ['irr', 'irregular', 'irrHint']].map((o, i) =>
        '<button type="button" class="btn opt" data-act="vclass" data-v="' + o[0] + '"><span class="k">' + (i + 1) + '</span><span>' + t(o[1]) + '<br><small>' + t(o[2]) + '</small></span></button>').join('') + '</div>';
    } else {

/* ---------- ANSWERS + FEEDBACK ---------- */
function lock() { $('#panel').querySelectorAll('button:not(#nextBtn),input').forEach(el => { el.disabled = true; }); }
function markOpts(chosenEl, rightText) {
  $('#panel').querySelectorAll('.opt').forEach(b => {
    const txt = b.dataset.text || b.lastElementChild.textContent;
    if (rightText !== null && txt === rightText) { b.classList.add('is-right'); b.lastElementChild.insertAdjacentText('beforeend', ' ✔'); }
    else if (b === chosenEl) { b.classList.add('is-wrong'); b.lastElementChild.insertAdjacentText('beforeend', ' ✖'); }
    else b.classList.add('dim');
  });
}
function resolve(q, ok, given, correct, extra) {
  extra = extra || {};
  const p = S.mode === 'practice', key = keyOf(q), ex = extra.ex || q.ex;
  let gained = 0;
  lock();
  if (!p) { const st = S.stats; st.levels[q.level].att++; st.skills[q.skill].att++; if (ok) { st.levels[q.level].ok++; st.skills[q.skill].ok++; } }
  if (ok) {
    S.hp--; S.okInLevel++;
    if (p) { const i = S.mistakes.findIndex(m => m.key === key); if (i >= 0) { S.mistakes.splice(i, 1); S.fixed++; } }
    else { S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); gained = 100 + Math.min(50, (S.streak - 1) * 10); S.score += gained; }
  } else {
    const m = S.mistakes.find(x => x.key === key);
    if (m) { m.given = given; m.correct = correct; m.ex = ex; }
    else S.mistakes.push({ key, q: Object.assign({}, q, { _opts: null, _b: null, _pre: true }), given, correct, ex });
    if (!p) { S.streak = 0; S.lives--; if (S.lives > 0) S.queue.push(Object.assign({}, q, { _opts: null, _b: null, retry: true })); }
  }
  const full = extra.full !== undefined ? extra.full : fullOf(q);
  S.fb = { ok, given, correct, ex, full, gained, note: extra.note || '', heard: q.audio || '', said: false,
    bonus: ok && !p && S.speak && S.okInLevel % 3 === 0 && full ? noEmoji(full).replace(/\s*\([^)]*\)/g, '') : '' };
  if (q.chat) {
    const done = q.type === 'listen' ? '🎤 “' + esc(q.audio) + '”' : q.type === 'order' ? '<b class="fill">' + esc(sentenceOf(q)) + '</b>' : esc(q.prompt).replace('___', '<b class="fill">' + esc(answerOf(q)) + '</b>');
    if (!q.retry) {
      S.chat.push(bubble(q.chat.who, done));
      q.chat.post.forEach(l => S.chat.push(bubble(l.who, esc(l.text))));
    }
    const chat = $('#chat'); if (chat) { chat.innerHTML = chatHTML(q, false) + (q.retry ? bubble(q.chat.who, done, 'now') : ''); chat.scrollTop = chat.scrollHeight; }
  }
  const fx = $('#fx'), pop = $('#pop');
  if (ok) {
    restart($('#hero'), 'attack'); restart($('#boss'), 'hit'); fx.className = 'fx'; pop.textContent = S.hp <= 0 ? 'K.O.!' : t('hit');
    if (S.hp <= 0) setTimeout(() => { const b = $('#boss'); if (b && S.fb) b.classList.add('dead'); }, 480);
    sfx(S.hp <= 0 ? SND.win : SND.hit);
  } else {
    restart($('#boss'), 'attack'); restart($('#hero'), 'hurt'); fx.className = 'fx left'; pop.textContent = t('miss'); sfx(SND.miss);
  }
  restart(fx, 'go'); restart(pop, 'go');
  updateHud();
  $('#panel').insertAdjacentHTML('beforeend', feedbackHTML());
  const nb = $('#nextBtn');
  try { nb.focus({ preventScroll: true }); $('#fb').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { nb.focus(); }
}
function feedbackHTML() {
  const f = S.fb, p = S.mode === 'practice';
  let h = '<section class="fb ' + (f.ok ? 'ok' : 'no') + '" id="fb" role="status">';
  h += '<h3>' + (f.ok ? '✔ ' + t('correct') + (f.gained ? ' +' + f.gained : '') : '✖ ' + t('wrong')) + '</h3>';
  if (!f.ok) {
    if (!p) h += '<p>♥ ' + t('lostHeart') + '</p>';
    h += '<p class="ans">' + t('yourAns') + ': ' + esc(f.given) + '</p><p class="ans">' + t('rightAns') + ': <b>' + esc(f.correct) + '</b></p>';
  }
  if (f.heard) h += '<p class="ans">' + t('heard') + ': “' + esc(f.heard) + '”</p>';
  else if (f.full && norm(f.full) !== norm(f.correct) || f.ok && f.full) h += '<p class="ans"><b>' + esc(f.full) + '</b></p>';
  h += '<p class="why"><b>' + (f.ok ? t('remember') : t('why')) + '</b> ' + esc(f.ex[li()]) + '</p>';
  if (f.note) h += '<p>' + esc(t(f.note)) + '</p>';
  if (!f.ok && !p && S.lives > 0) h += '<p class="muted">↩ ' + t('comeback') + '</p>';
  if (f.bonus) h += '<div class="bonus" id="bonus"><p class="eyebrow">🎤 ' + t('bonusT') + '</p><p>' + t('bonusD') + '</p><p class="say">“' + esc(f.bonus) + '”</p>' +
    (f.said ? '<p><span class="badge">✔ ' + t('bonusOk') + ' +30</span></p>' : '<div class="row">' + (NO_EN ? '' : btn('sayModel', '🔊 ' + t('listenBtn'), 'small')) + btn('saidIt', '✔ ' + t('saidIt') + ' +30', 'small') + '</div>') + '</div>';
  return h + btn('next', t('cont') + ' ▶', 'primary wide', 'id="nextBtn"') + '</section>';
}
function submitTyped() {
  const q = cur(), inp = $('#ans');
  if (S.fb || !inp) return;
  if (!inp.value.trim()) { restart(inp, 'shake'); inp.focus(); return; }
  const r = checkTyped(q, inp.value);
  resolve(q, r.ok, inp.value.trim(), q.answers[0], { note: r.note });
}

/* ---------- ACTIONS ---------- */
const ACT = {
  start: () => { sfx(SND.tap); showFighter(); },
  ready: () => { sfx(SND.tap); savePrefs(); newGame(); },
  hset: el => {
    S.hero[el.dataset.k] = el.dataset.v; sfx(SND.tap); savePrefs(); showFighter(true);
    const again = document.querySelector('[data-act="hset"][data-k="' + el.dataset.k + '"][data-v="' + el.dataset.v + '"]');
    if (again) again.focus({ preventScroll: true });
  },
  hrandom: () => {
    for (const k of Object.keys(LOOKS)) S.hero[k] = pick(LOOKS[k], 1)[0][0];
    sfx(SND.hit); savePrefs(); showFighter(true);
  },
  fight: () => { sfx(SND.tap); if (S.mode === 'practice') { S.screen = 'battle'; renderBattle(); top(); } else startLevel(); },
  nextWorld: () => { S.level++; showIntro(); },
  report: () => showSummary(),
  practice: () => startPractice(),
  retryWorld: () => { closePause(); S.mode = 'story'; S.score = S.levelStartScore; showIntro(); },
  restartWorld: () => { closePause(); S.score = S.levelStartScore; startLevel(); },
  menu: () => { closePause(); showTitle(); },
  pause: () => openPause(),
  resume: () => closePause(),
  tSound: () => { S.sound = !S.sound; refresh(); sfx(SND.tap); },
  tSpeak: () => { S.speak = !S.speak; refresh(); },
  tLang: () => { S.lang = S.lang === 'es' ? 'en' : 'es'; refresh(); },
  testVoice: () => say('Hello! Welcome to Holiday Battle. Last summer we went sightseeing, although it was very hot.'),
  play: () => say(cur().audio),
  reveal: () => { $('#transcript').hidden = false; },
  sayModel: () => say(S.fb.bonus),
  saidIt: () => { if (!S.fb || S.fb.said) return; S.fb.said = true; S.score += 30; S.stats.spoken++; sfx(SND.hit); updateHud();
    $('#bonus').querySelector('.row').outerHTML = '<p><span class="badge">✔ ' + t('bonusOk') + ' +30</span></p>'; },
  opt: el => {
    const q = cur(); if (S.fb) return;
    const chosen = q._opts[+el.dataset.i], right = q.type === 'verb2' ? verbOf(q.verb)[1] : q.options[0];
    markOpts(el, right);
    resolve(q, chosen === right, chosen, right);
  },
  vclass: el => {
    const q = cur(); if (S.fb) return;
    const v = verbOf(q.verb), irr = v[2] === 'irr';
    if ((el.dataset.v === 'irr') === irr) { S.work.step = 2; sfx(SND.tap); renderQuestion(); return; }
    markOpts(el, null);
    resolve(q, false, t(irr ? 'regular' : 'irregular'), t(irr ? 'irregular' : 'regular') + ': ' + v[0] + ' → ' + v[1], { full: '' });
  },
  tile: el => { const w = S.work; w.line.push(w.pool.splice(+el.dataset.i, 1)[0]); sfx(SND.tap); drawOrder(); },
  untile: el => { const w = S.work; w.pool.push(w.line.splice(+el.dataset.i, 1)[0]); drawOrder(); },
  checkOrder: () => {
    const q = cur(); if (S.fb) return;
    const mine = S.work.line.map(i => q.tiles[i]).join(' '), end = q.form === 'que' ? '?' : '.';
    const ok = [q.tiles.join(' '), ...q.alts].map(norm).includes(norm(mine));
    resolve(q, ok, cap(mine) + end, sentenceOf(q), ok ? { full: cap(mine) + end } : {});
  },
  chip: el => { S.work[el.dataset.k] = el.dataset.v; sfx(SND.tap); drawBuild(); },
  checkBuild: () => {
    const q = cur(), w = S.work; if (S.fb) return;
    const r = checkBuild(q, w.sub, w.verb, w.end);
    resolve(q, r.ok, r.given, r.correct, { ex: r.ex, full: r.ok ? r.given : '' });
  },
  next: () => {
    hush(); const lastOk = S.fb && S.fb.ok; S.fb = null; S.work = null;
    if (S.mode === 'story') {
      if (S.hp <= 0) return showClear();
      if (S.lives <= 0) return showDefeat();
    }
    S.qi++;
    if (S.hp <= 0 || S.qi >= S.queue.length) return showSummary();
    renderQuestion(); updateHud(); top(); void lastOk;
  }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.dataset.confirm === '1') { el.dataset.confirm = '2'; el.textContent = t('sure'); return; }
  const f = ACT[el.dataset.act]; if (f) f(el);
});
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.id === 'typeForm') submitTyped(); });
document.addEventListener('change', e => {
  if (e.target.id !== 'voiceSel') return;
  S.voice = e.target.value; VOICE = VOICES.find(v => v.name === S.voice) || VOICES[0] || null; savePrefs();
  say('Hello! This is my voice.');
});
document.addEventListener('input', e => {
  if (e.target.id !== 'heroName') return;
  S.hero.name = e.target.value.trim().slice(0, 12); savePrefs();
  const tag = $('#nameTag'); if (tag) { tag.textContent = S.hero.name; tag.hidden = !S.hero.name; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('#pause')) closePause(); else openPause(); return; }
  if ($('#pause') || S.screen !== 'battle' || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (/^[1-9]$/.test(e.key)) { const b = app.querySelectorAll('#opts .opt')[+e.key - 1]; if (b && !b.disabled) b.click(); }
});

const saved = store.get();
if (saved.lang === 'es' || saved.lang === 'en') S.lang = saved.lang;
if (typeof saved.sound === 'boolean') S.sound = saved.sound;
if (typeof saved.speak === 'boolean') S.speak = saved.speak;
if (typeof saved.best === 'number') S.best = saved.best;
if (typeof saved.voice === 'string') S.voice = saved.voice;
try { loadVoices(); speechSynthesis.addEventListener('voiceschanged', loadVoices); } catch (e) { /* no speech on this device */ }
if (saved.hero && typeof saved.hero === 'object') {
  for (const k of Object.keys(LOOKS)) if (LOOKS[k].some(o => o[0] === saved.hero[k])) S.hero[k] = saved.hero[k];
  if (typeof saved.hero.name === 'string') S.hero.name = saved.hero.name.slice(0, 12);
}
showTitle();
})();
</script>

</body></html>
